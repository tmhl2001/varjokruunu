name: Build Varjokruunu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        shell: bash
        run: |
          set -e
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(dirname "$(find extracted -type f -name "settings.gradle" | head -n 1)")
          echo "Project directory: $PROJECT_DIR"

          cp -r "$PROJECT_DIR"/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Varjokruunu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
